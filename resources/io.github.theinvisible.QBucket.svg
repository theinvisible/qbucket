<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- QBucket app icon. Master artwork: the Windows .ico is generated from
       the same geometry by resources/make_icon.ps1 — keep both in sync. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <!-- handle -->
  <path d="M70 96 Q128 22 186 96" fill="none" stroke="#FFFFFF" stroke-opacity="0.9"
        stroke-width="10" stroke-linecap="round"/>
  <!-- body -->
  <path d="M64 96 L84 194 Q86 208 100 208 L156 208 Q170 208 172 194 L192 96 Z" fill="#FFFFFF"/>
  <!-- band -->
  <path d="M74 144 Q128 162 182 144" fill="none" stroke="#2563EB" stroke-width="9"
        stroke-linecap="round"/>
  <!-- rim + opening -->
  <ellipse cx="128" cy="96" rx="64" ry="18" fill="#DBEAFE" stroke="#FFFFFF" stroke-width="8"/>
  <ellipse cx="128" cy="96" rx="50" ry="10" fill="#1E40AF" fill-opacity="0.55"/>
</svg>
