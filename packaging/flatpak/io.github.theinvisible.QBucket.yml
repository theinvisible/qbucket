# Flatpak manifest for QBucket.
#
# Built and tested in Docker, nothing installed on the host:
#   packaging/flatpak/build-in-docker.sh        → dist/qbucket-<version>-x86_64.flatpak
# or with a local flatpak-builder (from the repository root):
#   flatpak-builder --user --install --force-clean build-flatpak \
#       packaging/flatpak/io.github.theinvisible.QBucket.yml
#   flatpak run io.github.theinvisible.QBucket
#
# The test suite runs in the build sandbox (offscreen, in-process fake
# servers on loopback) — the shipped binary is the tested one.
#
# The runtime brings Qt; our CMake finds it via find_package() inside the SDK.
# Keep runtime-version on a supported KDE branch (Qt >= 6.5).
id: io.github.theinvisible.QBucket
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: qbucket

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # S3 endpoints (from M1 on).
  - --share=network
  # Default download target; everything else goes through the FileChooser
  # portal — no blanket home access (PLAN.md §9).
  - --filesystem=xdg-download

cleanup:
  - /include
  - /lib/cmake
  - '*.a'

modules:
  # Secrets go to the keychain through QtKeychain → libsecret (in the KDE
  # runtime), which uses the Secret portal inside the sandbox.
  - name: qtkeychain
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_WITH_QT6=ON
      - -DBUILD_TRANSLATIONS=OFF
      - -DBUILD_TEST_APPLICATION=OFF
    cleanup:
      - /include
      - /lib/cmake
      - /mkspecs
    sources:
      - type: archive
        url: https://github.com/frankosterfeld/qtkeychain/archive/refs/tags/0.15.0.tar.gz
        sha256: f4254dc8f0933b06d90672d683eab08ef770acd8336e44dfa030ce041dc2ca22

  - name: qbucket
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DQBUCKET_BUILD_TESTS=ON
      # The build is offline: use the qtkeychain module above.
      - -DQBUCKET_QTKEYCHAIN_PROVIDER=SYSTEM
    run-tests: true
    build-options:
      env:
        QT_QPA_PLATFORM: offscreen
        CTEST_OUTPUT_ON_FAILURE: '1'
    sources:
      - type: dir
        path: ../..
        skip:
          - build
          - build-flatpak
          - build-release
          - build-asan
          - build-s3-asan
          - .flatpak-builder
          - cmake-build-debug
          - cmake-build-release
          - dist
